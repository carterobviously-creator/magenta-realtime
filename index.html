
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magenta.js Realtime Generator</title>
  <!-- Load Magenta.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@magenta/music@1.23.1/dist/magentamusic.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    h2 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #f1f5f9;
    }
    p {
      color: #94a3b8;
      font-size: 0.875rem;
      line-height: 1.4;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .slider-group {
      display: flex;
      gap: 16px;
    }
    .slider-item {
      flex: 1;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #6366f1;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-stop {
      background: #e11d48;
    }
    #status {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #38bdf8;
      text-align: center;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎵 Magenta.js Realtime Generator</h2>
    <p>Type a chord progression prompt (e.g. <code>C Am F G</code> or <code>Dm G C</code>) and hit play to stream continuous real-time AI music.</p>

    <div class="form-group">
      <label for="chordInput">Chord Progression Prompt</label>
      <input type="text" id="chordInput" value="C Am F G" placeholder="e.g. C Am F G or Dm G C">
    </div>

    <div class="slider-group">
      <div class="slider-item form-group">
        <label for="tempInput">Creativity (<span id="tempVal">1.1</span>)</label>
        <input type="range" id="tempInput" min="0.5" max="2.0" step="0.1" value="1.1">
      </div>
      <div class="slider-item form-group">
        <label for="bpmInput">Tempo BPM (<span id="bpmVal">120</span>)</label>
        <input type="range" id="bpmInput" min="60" max="180" step="1" value="120">
      </div>
    </div>

    <button id="playBtn" class="btn">Start Realtime Music</button>
    <div id="status">Ready</div>
  </div>

  <script>
    // Initialize Magenta MusicRNN (Chord/Melody Improv) and Player
    const musicRnn = new mm.MusicRNN('https://storage.googleapis.com/magentadata/js/checkpoints/music_rnn/chord_pitches_improv');
    const player = new mm.Player();

    let isPlaying = false;
    let modelLoaded = false;

    const playBtn = document.getElementById('playBtn');
    const statusDiv = document.getElementById('status');
    const chordInput = document.getElementById('chordInput');
    const tempInput = document.getElementById('tempInput');
    const tempVal = document.getElementById('tempVal');
    const bpmInput = document.getElementById('bpmInput');
    const bpmVal = document.getElementById('bpmVal');

    tempInput.addEventListener('input', () => tempVal.textContent = tempInput.value);
    bpmInput.addEventListener('input', () => {
      bpmVal.textContent = bpmInput.value;
      player.setTempo(parseInt(bpmInput.value));
    });

    playBtn.addEventListener('click', async () => {
      if (isPlaying) {
        stopGeneration();
        return;
      }

      try {
        playBtn.disabled = true;
        statusDiv.textContent = 'Loading Magenta RNN model...';

        if (!modelLoaded) {
          await musicRnn.initialize();
          modelLoaded = true;
        }

        isPlaying = true;
        playBtn.textContent = 'Stop Music';
        playBtn.classList.add('btn-stop');
        playBtn.disabled = false;
        statusDiv.textContent = 'Generating & playing realtime music...';

        generateAndPlayNextMeasure();
      } catch (err) {
        statusDiv.textContent = 'Error: ' + err.message;
        stopGeneration();
      }
    });

    async function generateAndPlayNextMeasure() {
      if (!isPlaying) return;

      const chords = chordInput.value.trim().split(/\s+/).filter(c => c.length > 0);
      const activeChords = chords.length > 0 ? chords : ['C', 'G', 'Am', 'F'];

      // Seed motif sequence
      const seedSeq = {
        ticksPerQuarter: 220,
        totalQuantizedSteps: 4,
        quantizationInfo: { stepsPerQuarter: 4 },
        notes: [
          { pitch: 60, quantizedStartStep: 0, quantizedEndStep: 4 }
        ]
      };

      const temperature = parseFloat(tempInput.value);
      player.setTempo(parseInt(bpmInput.value));

      try {
        // Generate 32 steps (2 bars) of music following the chord prompt
        const continuation = await musicRnn.continueSequence(
          seedSeq,
          32,
          temperature,
          activeChords
        );

        if (!isPlaying) return;

        // Play sequence and loop generation seamlessly
        player.start(continuation).then(() => {
          if (isPlaying) {
            generateAndPlayNextMeasure();
          }
        });
      } catch (err) {
        console.error(err);
        statusDiv.textContent = 'Generation error: ' + err.message;
      }
    }

    function stopGeneration() {
      isPlaying = false;
      player.stop();
      playBtn.textContent = 'Start Realtime Music';
      playBtn.classList.remove('btn-stop');
      playBtn.disabled = false;
      statusDiv.textContent = 'Stopped';
    }
  </script>
</body>
</html>
